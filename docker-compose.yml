version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ticketbot
      POSTGRES_USER: ticketbot
      POSTGRES_PASSWORD: ticketbot
    # No host port mapping: the bot reaches postgres over the compose
    # network, and host 5432 is often taken by a locally installed
    # PostgreSQL. Add "5433:5432" here if you need psql access from the host.
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketbot"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ticketbot
      SPRING_DATASOURCE_USERNAME: ticketbot
      SPRING_DATASOURCE_PASSWORD: ticketbot
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME}
      RAILWAY_BASE_URL: ${RAILWAY_BASE_URL:-https://eticket.railway.uz}
    ports:
      - "8080:8080"

volumes:
  postgres-data:
